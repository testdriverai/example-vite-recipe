name: TestDriver v6

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
    contents: read # To allow the action to read repository contents
    pull-requests: write # To allow the action to create/update pull request comments

jobs:
  test:
    name: "TestDriver"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run test in headless mode
        run: |
         npm ci
         npm run build
         npm run preview & npx wait-on http://localhost:4173 && npx testdriverai@latest run testdriver/test.yml
        env:
          FORCE_COLOR: 3
          TD_API_KEY: ${{ secrets.TESTDRIVER_API_KEY }}
          TD_THIS_FILE: "the only test for the recipe app"